name: release

on:
  push:
    tags:
      # Exact semver only (vX.Y.Z) — a floating major tag like "v0"/"v1"
      # (used so consumers can pin `@v1` and follow patch releases) must
      # never itself trigger a new release build.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 全履歴が必要(ADR 0005: リリースノートはgit logから自作生成する)。
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        # -trimpath drops the builder's absolute filesystem paths from the
        # binary so two builds of the same commit produce identical output
        # regardless of where they were built.
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o mise-bump-action_linux_amd64 ./cmd/mise-bump-action

      - name: Generate checksums
        run: sha256sum mise-bump-action_linux_amd64 > checksums.txt

      - name: Generate release notes from Conventional Commits
        id: notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi

          {
            echo "## Changes"
            for entry in "feat:Features" "fix:Fixes" "perf:Performance" "docs:Docs" "test:Tests" "refactor:Refactoring" "build:Build" "ci:CI" "revert:Reverts" "chore:Chores"; do
              prefix="${entry%%:*}"
              label="${entry#*:}"
              # "!" marks a breaking change (e.g. "feat!:" or "fix(scope)!:"),
              # which must still classify under its base type.
              # Wrap "@name" in backticks so GitHub doesn't autolink/notify a
              # real account (ADR 0007; troubleshooting.md has the incident).
              # shellcheck disable=SC2016 # \1 here is a sed backreference, not a shell expansion
              commits=$(git log "$range" --no-merges --pretty=format:"- %s (%h)" --grep "^${prefix}(\(.*\))?!?:" -E | sed -E 's/@([A-Za-z0-9](-?[A-Za-z0-9])*)/`@\1`/g')
              if [ -n "$commits" ]; then
                printf '\n### %s\n%s\n' "$label" "$commits"
              fi
            done
            if [ -n "$prev_tag" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev_tag" "$GITHUB_REF_NAME"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" mise-bump-action_linux_amd64 checksums.txt --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
